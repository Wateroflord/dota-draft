name: dota_draft
description: Помощник драфта Dota 2 — пики, контрпики, шанс победы.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  http: ^1.2.2
  path_provider: ^2.1.4
  flutter_tts: ^4.2.0
  wakelock_plus: ^1.2.8
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0
  image: ^4.2.0
  android_alarm_manager_plus: '>=4.0.0 <6.0.0'
  flutter_local_notifications: ^19.0.0
  home_widget: '>=0.7.0 <1.0.0'

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/draft.json
    - assets/bench.json
    - assets/heroinfo.json
    - assets/patch.json
    - assets/pro_drafts.json
    - assets/portraits.json

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0B0B0D"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  min_sdk_android: 21
