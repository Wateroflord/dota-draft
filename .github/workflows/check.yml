name: Check (branches)

# Быстрая проверка кода на рабочих ветках: без сборки и без выпуска релиза.
on:
  push:
    branches-ignore: [main]
    paths-ignore:
      - 'data/**'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare
        run: |
          mkdir -p assets
          cp data/draft.json assets/draft.json
          for f in bench heroinfo patch pro_drafts portraits items; do
            if [ -f data/$f.json ]; then cp data/$f.json assets/$f.json; else echo "{}" > assets/$f.json; fi
          done
          flutter create --project-name dota_draft --org com.dotadraft --platforms android .
          rm -f test/widget_test.dart
          flutter pub get
      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings lib test > analyze.txt 2>&1 && ok=1 || ok=0
          grep -E "error •|warning •" analyze.txt || true
          python3 tools/annotate.py analyze.txt "analyze"
          [ "$ok" = 1 ]
      - name: Unit tests
        run: flutter test test
