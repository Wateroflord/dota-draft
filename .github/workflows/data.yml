name: Update hero stats

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Fetch stats from OpenDota
        run: python3 tools/fetch_data.py --calls 1500 --minutes 32
        env:
          OPENDOTA_KEY: ${{ secrets.OPENDOTA_KEY }}
      - name: Commit data
        run: |
          git config user.name "dota-draft-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Update hero stats $(date -u +%F)"
          git pull --rebase origin main
          git push
