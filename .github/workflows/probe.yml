name: Probe APIs
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/probe.py > probe_out.txt 2>&1 || true
      - run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git checkout -b probe
          git add -f probe_out.txt
          git commit -m "probe output"
          git push -f origin probe
