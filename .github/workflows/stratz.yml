name: Update lane stats (STRATZ)

on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'tools/fetch_stratz.py'
      - '.github/workflows/stratz.yml'

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  stratz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch lane outcomes from STRATZ
        run: python3 tools/fetch_stratz.py
        env:
          STRATZ_TOKEN: ${{ secrets.STRATZ_TOKEN }}
      - name: Commit data
        run: |
          git config user.name "dota-draft-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Update lane stats $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
