name: Screenshot test on emulator

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Data assets
        run: |
          mkdir -p assets
          cp data/draft.json assets/draft.json
          for f in bench heroinfo patch pro_drafts portraits items; do
            if [ -f data/$f.json ]; then cp data/$f.json assets/$f.json; else echo "{}" > assets/$f.json; fi
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android project files
        run: |
          flutter create --project-name dota_draft --org com.dotadraft --platforms android .
          rm -rf test
          python3 tools/patch_android.py > /dev/null
          flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            timeout 1800 flutter drive --keep-app-running --driver=test_driver/integration_test.dart --target=integration_test/screens_test.dart > drive.txt 2>&1 || true
            adb exec-out run-as com.dotadraft.dota_draft tar c app_flutter/shots > shots.tar || true
      - name: Save screenshots to branch
        if: always()
        run: |
          mkdir -p screenshots
          cp drive.txt screenshots/ || true
          tar xf shots.tar -C screenshots || true
          git config user.name "dota-draft-bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf screenshots/app_flutter screenshots/report.json
          git checkout --orphan screens-out
          git rm -rf --cached . > /dev/null
          git add -f screenshots
          git commit -m "screenshots" > /dev/null
          git push -f origin screens-out > push.txt 2>&1 || { echo "error: push failed"; cat push.txt; python3 tools/annotate.py push.txt build; exit 1; }
