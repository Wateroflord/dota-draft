# Сборка — общая для всех приложений Winter: winter-hub/.github/workflows/flutter-app.yml
# (отдельный APK под каждый процессор, подпись, релиз, Windows-установщик).
name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'tools/fetch_*.py'
      - 'tools/probe.py'
      - '.github/workflows/probe.yml'
      - '.github/workflows/info.yml'
      - '.github/workflows/bench.yml'
      - '.github/workflows/data.yml'
      - '.github/workflows/stratz.yml'
      - '.github/workflows/check.yml'
      - '.github/workflows/screens.yml'
      - '.github/workflows/winsmoke.yml'
      - 'integration_test/**'
      - 'test_driver/**'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Выпустить релиз (выключи, чтобы только проверить сборку)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  app:
    uses: Wateroflord/winter-hub/.github/workflows/flutter-app.yml@main
    secrets: inherit
    with:
      project: dota_draft
      org: com.dotadraft
      asset: Dota-Draft
      title: Dota Draft
      win_title: Dota Draft
      prepare: bash tools/prepare_assets.sh
      notes: 'Windows без установки: Dota-Draft-Windows.zip — распакуй и запусти dota_draft.exe.'
      publish: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
